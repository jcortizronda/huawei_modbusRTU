    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 37125
    bitmask: 0x01
    disabled_by_default: true

sensor:
  # Range 30070 - 30075
  - name: "Info Number of strings"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30071
    value_type: U_WORD
    disabled_by_default: true
  - name: "Info Rated Power"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30073
    value_type: U_DWORD
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - name: "Info Maximum Active Power"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30075
    value_type: U_DWORD
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Range 32000 - 32019 (2/2)
  # Registers 32016 - 32019
  - name: "PV1 Voltage"
    id: pv1_voltage
    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 32016
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - name: "PV1 Current"
    id: pv1_current
    platform: modbus_controller
    modbus_controller_id: huawei_slow
    register_type: holding
    address: 32017
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - name: "PV2 Voltage"
    id: pv2_voltage
    platform: modbus_controller
    modbus_controller_id: huawei_slow
    register_type: holding
    address: 32018
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    disabled_by_default: true
  - name: "PV2 Current"
    id: pv2_current
    platform: modbus_controller
    modbus_controller_id: huawei_slow
    register_type: holding
    address: 32019
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    disabled_by_default: true
    on_value:
      - sensor.template.publish:
          id: pv1_power
          state: !lambda 'return id(pv1_current).state * id(pv1_voltage).state / 1000;'
      - sensor.template.publish:
          id: pv2_power
          state: !lambda 'return id(pv2_current).state * id(pv2_voltage).state / 1000;'
      - sensor.template.publish:
          id: string_ratio
          state: !lambda 'return (id(pv2_current).state * id(pv2_voltage).state) / (id(pv1_current).state * id(pv1_voltage).state);'

  # Templates of range 32016 - 32019
  - name: "PV1 Power"
    platform: template
    id: pv1_power
    icon: mdi:flash
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
  - name: "PV2 Power"
    platform: template
    id: pv2_power
    icon: mdi:flash
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    disabled_by_default: true
  - name: "String Ratio"
    platform: template
    id: string_ratio
    icon: mdi:solar-panel-large
    state_class: measurement
    unit_of_measurement: ""
    accuracy_decimals: 3
    disabled_by_default: true

  # Range 32064 - 32114 (2/2)
  - name: "Input Power"
    icon: "mdi:solar-power"
    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 32064
    value_type: S_DWORD
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - name: "Grid Voltage"
    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 32066
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - throttle_average: 60s
  - name: "Grid Current"
    id: inverter_current
    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 32072
    value_type: S_DWORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - name: "Peak Power today"
    icon: "mdi:solar-power"
    platform: modbus_controller
    modbus_controller_id: huawei_inverter
    register_type: holding
    address: 32078
    value_type: S_DWORD
    unit_of_measurement: "kW"
    device_class

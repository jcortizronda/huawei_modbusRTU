esphome:
  name: huawei-inverter
  friendly_name: huawei-inverter

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret huawei-inverter-encryption

ota:
  - platform: esphome
    password: !secret huawei-inverter-ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Huawei-Inverter Fallback Hotspot"
    password: !secret huawei-inverter-fallback

captive_portal:

switch:
  - platform: restart
    name: "Restart"

uart:
  id: mod_bus
  baud_rate: 9600
  tx_pin: GPIO17  # TX2
  rx_pin: GPIO18  # RX2
  rx_buffer_size: 1024
  data_bits: 8
  stop_bits: 1
  parity: NONE

modbus:
  id: modbus1
  turnaround_time: 750ms

modbus_controller:
  # Lecturas rapidas (potencias, estados, alarmas)
  - id: huawei_inverter
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 15s
  # Lecturas lentas (energias acumuladas, corrientes de string)
  - id: huawei_slow
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 60s
  # Informacion estatica del equipo
  - id: huawei_info
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 1h

text_sensor:
  # Range 30000 - 30035
  - name: "Info Model"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30000
    response_size: 30
  - name: "Info Serial Number"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30015
    response_size: 20
  - name: "Info Part Number"
    icon: "mdi:information"
    platform: modbus_controller
    modbus_controller_id: huawei_info
    register_type: holding
    address: 30025
    response_size: 20

  # Inverter status string
  - name: "Status"
    platform: template
    id: inverter_status_string
    icon: "mdi:information"


